[book]
title = "CodeGraph 源码导读"
authors = ["CodeGraph Contributors"]
description = "从 tree-sitter 到 MCP:CodeGraph 的架构、源码与设计取舍"
src = "src"
language = "zh"

[build]
create-missing = false

[output.html]
default-theme = "rust"
git-repository-url = "https://github.com/colbymchenry/codegraph"
edit-url-template = "https://github.com/colbymchenry/codegraph/edit/main/docs/book/{path}"
