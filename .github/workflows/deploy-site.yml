name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/book/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Not using withastro/action here: it unconditionally uploads a
      # `github-pages` artifact of site/dist, which collides with the merged
      # (site + book) artifact uploaded below.
      - name: Build landing site with Astro
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Build source-guide book with VitePress
        working-directory: docs/book
        run: |
          npm ci
          npx vitepress build
      - name: Mount book under site output
        run: cp -r docs/book/.vitepress/dist site/dist/book
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
